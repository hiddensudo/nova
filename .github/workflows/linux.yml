name: Linux build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test in Debian 12
        run: docker build --target artifacts --output type=local,dest=dist .
      - name: Check the extracted installation
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          smoke="$RUNNER_TEMP/nova-control"
          mkdir -p "$smoke"
          tar -xf dist/nova-control-*-linux-x86_64.tar.gz -C "$smoke"
          cd "$smoke"/nova-control-*-linux-x86_64
          version=$(bin/nova-control --version)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v${version#nova-control }"
          fi
          XDG_CONFIG_HOME="$smoke/config" XDG_DATA_HOME="$smoke/share" python3 install.py --bin-dir "$smoke/bin"
          test "$("$smoke/bin/nova-control" --version)" = "$version"
          test -s "$smoke/share/applications/nova-control.desktop"
          test -s "$smoke/config/autostart/nova-control-mixer.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-control-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nova-control-linux-x86_64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
