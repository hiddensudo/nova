[package]
name = "nova-control"
version = "0.3.7"
edition = "2024"
rust-version = "1.95"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"], optional = true }

ashpd = { version = "0.11.1", default-features = false, features = ["async-std"], optional = true }
async-channel = { version = "2.5", optional = true }
futures-lite = { version = "2.6", optional = true }

image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
resvg = { version = "0.45.1", default-features = false, optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:ksni", "dep:ashpd", "dep:async-channel", "dep:futures-lite", "dep:image", "dep:resvg"]
