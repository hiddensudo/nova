name: Headset compatibility report
description: Help verify headset status and ChatMix on real hardware
title: "[Headset] "
body:
  - type: input
    id: model
    attributes:
      label: Exact headset model, including generation and suffix
    validations:
      required: true
  - type: input
    id: linux
    attributes:
      label: Linux distribution and Nova Control version
  - type: textarea
    id: diagnostics
    attributes:
      label: Read-only status and dial observations
      description: Run nova-control probe with one supported dongle connected. Include the center and both ends of the wheel, a reading while charging, and a reading with the headset off. Remove personal information from pasted output.
      render: text
    validations:
      required: true
